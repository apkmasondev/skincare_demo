<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6D8BA" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B3E" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="22" fill="#141312" />
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.4" />
  
  <!-- Monogram Letter A -->
  <text x="50" y="74" font-family="'Cormorant Garamond', Georgia, serif" font-size="72" font-weight="400" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="-0.02em">A</text>
</svg>
